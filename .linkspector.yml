---
dirs:
- .
# The vendored spec carries illustrative links (`/tables/customer-metrics.md`)
# that were never meant to resolve here. Named individually: this directory also
# holds our own documents, whose links must stay checked.
excludedFiles:
- ./skills/fkb/references/SPEC.md
- ./skills/fkb/references/concept-template.md
fileExtensions:
- md
useGitIgnore: true
ignorePatterns:
- pattern: '^mailto:'
- pattern: '^https://me\.example/.*'  # placeholder URL in workspace.okf.yaml.example
- pattern: '^https://them\.example/.*'  # placeholder upstream URL in docs
aliveStatusCodes:
- 200
- 206
- 429  # rate-limited, but the target exists
timeout: 10000
retryCount: 3

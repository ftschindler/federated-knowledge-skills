---
name: Release

# Every merge to main ships. The version lives in a file rather than only in a
# tag because a skill is installed by copying `skills/fkb/` - no history, no
# remote, no tag comes with it - so a copy that cannot read its own version out
# of a file it carries cannot tell an old setup from a current one, which is the
# whole of the migration mechanism.
#
# That file is written here and never in a pull request. Two reasons, and the
# second is the one that decided it: a hand-bumped version disagrees with its
# tag the first time somebody forgets, and every concurrent pull request touches
# the same line and conflicts on merge. What a pull request carries instead is a
# label saying how big it is, which is a thing a reviewer already decides.

on:
  pull_request:
    types: [opened, reopened, labeled, unlabeled, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Never cancelled in flight: a release half-done is a tag with no version file
  # behind it, or the reverse.
  group: release_${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  bump_label:
    name: 🏷 (the pull request says how big it is)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0

    - name: Refuse a pull request without exactly one bump label
      # Exactly one, not at least one: two labels is not a bigger bump, it is a
      # disagreement, and picking the larger silently would release a major
      # because somebody left `minor` on from an earlier round.
      env:
        LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
      run: |
        set -euo pipefail
        chosen=""
        for label in ${LABELS}; do
          case "${label}" in
            major|minor|patch|no-release)
              if [ -n "${chosen}" ]; then
                echo "::error::Two bump labels (${chosen}, ${label}). One says what this change is."
                exit 1
              fi
              chosen="${label}"
              ;;
          esac
        done
        if [ -z "${chosen}" ]; then
          echo "::error::Label this pull request major, minor, patch or no-release."
          echo "major: a setup that works stops working. minor: something new. patch: a fix."
          echo "no-release: nothing that ships - CI, docs about the repo itself."
          exit 1
        fi
        echo "This pull request is a ${chosen}."

    - name: Refuse a hand-edited version
      # The release job owns this file. A pull request that also writes it gets
      # overwritten on merge at best, and at worst ships a version the tag does
      # not agree with - which is unfixable afterwards, because the copies are
      # already on people's disks.
      run: |
        set -euo pipefail
        base="origin/${{ github.event.pull_request.base.ref }}"
        if git diff --name-only "${base}...HEAD" | grep -qx 'skills/fkb/VERSION'; then
          echo "::error::skills/fkb/VERSION is written by the release job. Use a bump label instead."
          exit 1
        fi

  release:
    name: 🏷 (tag the merge)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
        # A push made with the default token starts no workflows, which is
        # deliberate here - the release commit is not a change anybody needs
        # tested twice - but it also cannot pass branch protection. A token with
        # that permission is the one piece of this that has to be configured by
        # hand; without it the job says so rather than half-releasing.
        token: ${{ secrets.RELEASE_TOKEN || github.token }}

    - name: Setup uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

    - name: Find the bump this merge asked for
      id: bump
      # From the pull request the commit came in on, because that is where a
      # person judged the change as a whole. A push straight to main has no such
      # judgement and releases nothing: silence is the safe reading, since the
      # alternative is guessing a severity for a change nobody reviewed.
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        labels=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
          --jq '.[0].labels[].name' || true)
        level=""
        for label in ${labels}; do
          case "${label}" in
            major|minor|patch) level="${label}" ;;
            no-release) level="none" ;;
          esac
        done
        if [ -z "${level}" ]; then
          echo "No bump label on the pull request this commit arrived in; nothing to release."
          level="none"
        fi
        echo "level=${level}" >> "${GITHUB_OUTPUT}"

    - name: Work out the next version
      id: version
      if: steps.bump.outputs.level != 'none'
      run: |
        set -euo pipefail
        current=$(cat skills/fkb/VERSION)
        next=$(uv run .scripts/next-version.py "${current}" "${steps_level}")
        echo "current=${current}" >> "${GITHUB_OUTPUT}"
        echo "next=${next}" >> "${GITHUB_OUTPUT}"
        echo "Releasing ${current} -> ${next}."
      env:
        steps_level: ${{ steps.bump.outputs.level }}

    - name: Write the version, commit it and tag it
      if: steps.bump.outputs.level != 'none'
      # One commit carrying the version, and the tag on that commit rather than
      # on the merge: a tag whose tree holds the previous version is a release
      # that installs as its predecessor, and nothing downstream can tell.
      env:
        NEXT: ${{ steps.version.outputs.next }}
      run: |
        set -euo pipefail
        printf '%s\n' "${NEXT}" > skills/fkb/VERSION
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add skills/fkb/VERSION
        git commit -m "Release ${NEXT}"
        git tag -a "v${NEXT}" -m "Release ${NEXT}"
        git push origin HEAD:main
        git push origin "v${NEXT}"

    - name: Announce it
      if: steps.bump.outputs.level != 'none'
      env:
        GH_TOKEN: ${{ github.token }}
        NEXT: ${{ steps.version.outputs.next }}
        PREVIOUS: ${{ steps.version.outputs.current }}
      run: |-
        set -euo pipefail
        notes="skills/fkb/references/migrations/${NEXT}.md"
        body="Installed copies of the skill see this as \`fkb ${NEXT}\`."
        if [ -f "${notes}" ]; then
          body="${body} Existing setups are asked to migrate: see \`${notes}\`."
        fi
        gh release create "v${NEXT}" \
          --title "v${NEXT}" \
          --notes "${body}" \
          --generate-notes \
          --verify-tag

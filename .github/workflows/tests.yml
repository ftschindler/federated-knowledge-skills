---
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests_${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  support_script_tests:
    name: 🛠 (Support script tests)
    runs-on: ubuntu-latest
    timeout-minutes: 2  # something is off if we need more than this
    defaults:
      run:
        shell: bash -elo pipefail {0}
    steps:

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Setup uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

    - name: Run support script tests
      run: make test_python_scripts

  federation_tests:
    name: 🛠 (Federation tests)
    runs-on: ubuntu-latest
    # Clones two real published bundles and runs the CLI against them. No LLM,
    # so this is minutes rather than the agent job's quarter hour, but it does
    # reach the network and it does depend on repositories this one does not
    # own: a failure here can mean somebody restructured their bundle, which is
    # a true statement about the federation and worth being told about.
    timeout-minutes: 5
    defaults:
      run:
        shell: bash -elo pipefail {0}
    steps:

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Setup uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

    - name: Run the CLI against real bundles
      run: make test_federation

  agent_tests:
    name: 🛠 (Agent tests)
    runs-on: ubuntu-latest
    # Two e2e tests: one builds a disposable agent, one additionally talks to it.
    # A run's duration swings with the tool path the model picks, so the cap is
    # generous; anything past it is a problem, not a slow runner.
    timeout-minutes: 15
    defaults:
      run:
        shell: bash -elo pipefail {0}
    steps:

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Setup node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: "24"

    - name: Setup uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

    - name: Drive a disposable agent
      run: make test_agent

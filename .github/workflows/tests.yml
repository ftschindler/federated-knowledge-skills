---
name: Tests

# Pull requests only, and deliberately. GitHub builds a pull request's checks
# against the head merged into `main`, so what these jobs run on is already the
# merge result rather than the branch in isolation - running them again after
# the merge tests a tree that passed a minute earlier.
#
# It also ends a confusion the release job introduced: that job pushes a version
# commit seconds behind every merge, which landed in the same concurrency group
# as the merge itself and cancelled its checks, leaving every merge commit
# showing a cancelled run forever.
#
# What this gives up is the case where two pull requests pass separately and
# conflict in meaning once both are in. Closing that needs the branch to be up
# to date before merging, which is a repository setting rather than anything
# here, and `workflow_dispatch` remains for asking `main` the question by hand.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests_${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  support_script_tests:
    name: 🛠 (Support script tests, ${{ matrix.os }})
    # Both operating systems, because the failures portability costs us are
    # exactly the ones a single-platform matrix cannot see: a symlink that
    # clones as a text file, a `file://` URL git reads as a hostname, a `HOME`
    # redirect that leaves `Path.home()` pointing at the real one.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 5  # something is off if we need more than this
    steps:

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Setup uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      with:
        # This repository has no pyproject.toml and no lockfile: every script
        # carries its own dependencies in a PEP 723 header, so those files are
        # what a cache here has to be keyed on. Left to the default globs the
        # action matches nothing, says so, and keeps a cache that can never be
        # invalidated - which is worse than none, because it goes stale in
        # silence.
        cache-dependency-glob: |
          .scripts/*.py
          skills/fkb/scripts/*

    - name: Refuse a checkout whose symlinks did not survive
      # A Windows runner clones without `core.symlinks`, so a committed symlink
      # arrives as a text file holding its target path and everything reading
      # through it reads that string. The guard runs here as well as in
      # pre-commit so the job says which failure it is.
      run: uv run --script .scripts/check_no_symlinks.py

    - name: Run support script tests
      # `make` is a convenience, not a dependency, and Windows runners have no
      # GNU make. The target is one line either way.
      run: uv run .scripts/run-tests.py python_scripts

  federation_tests:
    name: 🛠 (Federation tests, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    # Clones two real published bundles and runs the CLI against them. No LLM,
    # so this is minutes rather than the agent job's quarter hour, but it does
    # reach the network and it does depend on repositories this one does not
    # own: a failure here can mean somebody restructured their bundle, which is
    # a true statement about the federation and worth being told about.
    timeout-minutes: 10
    steps:

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Setup uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      with:
        # This repository has no pyproject.toml and no lockfile: every script
        # carries its own dependencies in a PEP 723 header, so those files are
        # what a cache here has to be keyed on. Left to the default globs the
        # action matches nothing, says so, and keeps a cache that can never be
        # invalidated - which is worse than none, because it goes stale in
        # silence.
        cache-dependency-glob: |
          .scripts/*.py
          skills/fkb/scripts/*

    - name: Run the CLI against real bundles
      run: uv run .scripts/run-tests.py federation

  agent_tests:
    name: 🛠 (Agent tests, ${{ matrix.os }})
    # Both, like the other two. This layer is the only one that exercises the
    # skill the way a person meets it - an agent reading SKILL.md and typing what
    # it says - so it is the only one that can catch an instruction which only
    # parses in a POSIX shell. A user hit exactly that, and nothing else here
    # would have told us. The jobs run in parallel, so the wall clock is one
    # agent run either way.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    # Two e2e tests: one builds a disposable agent, one additionally talks to it.
    # A run's duration swings with the tool path the model picks, so the cap is
    # generous; anything past it is a problem, not a slow runner.
    timeout-minutes: 20
    steps:

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Setup node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: "24"

    - name: Setup uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      with:
        # This repository has no pyproject.toml and no lockfile: every script
        # carries its own dependencies in a PEP 723 header, so those files are
        # what a cache here has to be keyed on. Left to the default globs the
        # action matches nothing, says so, and keeps a cache that can never be
        # invalidated - which is worse than none, because it goes stale in
        # silence.
        cache-dependency-glob: |
          .scripts/*.py
          skills/fkb/scripts/*

    - name: Drive a disposable agent
      run: uv run .scripts/run-tests.py agent

  tests:
    name: 🛠 (Tests)
    # The single job branch protection requires. A matrix job's check is named
    # after the axis it ran on, so requiring them directly means editing the
    # protection rule every time the matrix changes - and, worse, a job that
    # stops being produced does not fail the rule, it silently stops being
    # required. This one has a fixed name and fails unless every job above
    # actually succeeded.
    runs-on: ubuntu-latest
    needs: [support_script_tests, federation_tests, agent_tests]
    # `always()`, or this job is skipped the moment anything it needs fails,
    # and a skipped required check is one that never reports.
    if: always()
    timeout-minutes: 2
    steps:

    - name: Report what each job did
      run: echo '${{ toJSON(needs) }}'

    - name: Fail unless every job above succeeded
      # `skipped` and `cancelled` are failures here as much as `failure` is: the
      # question this job answers is whether the suite ran and passed, and a
      # layer that did not run has not passed.
      if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        }}
      run: exit 1

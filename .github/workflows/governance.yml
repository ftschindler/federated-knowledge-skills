---
name: Governance

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: governance_${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  governance:
    name: 🩺 (run governance checks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash -elo pipefail {0}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Setup node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: "24"

    - name: Setup uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      with:
        # This repository has no pyproject.toml and no lockfile: every script
        # carries its own dependencies in a PEP 723 header, so those files are
        # what a cache here has to be keyed on. Left to the default globs the
        # action matches nothing, says so, and keeps a cache that can never be
        # invalidated - which is worse than none, because it goes stale in
        # silence.
        cache-dependency-glob: |
          .scripts/*.py
          skills/fkb/scripts/*

    - name: Run pre-commit hooks
      run: uvx prek run --show-diff-on-failure --color=always --all-files
